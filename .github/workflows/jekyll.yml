name: Jekyll site CI

# The kit lives on the `ett` branch until it replaces the old app on `main`.
# Repository variable KIT_BRANCH names the branch that publishes (default: ett).
# Deploying is off until KIT_DEPLOY=true: the repository has one GitHub Pages site,
# and deploying from `ett` would replace whatever `main` publishes today.
on:
  push:
    branches: [ ett, main ]
  pull_request:
    branches: [ ett, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.204.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          bundle install

      - name: Check module front matter
        run: |
          python3 -m pip install --quiet pyyaml
          python3 var/check_modules.py

      - name: Build the sidebar from the pages
        run: python3 var/make_sidebar.py

      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEKYLL_BUILD_BRANCH: ${{ github.ref_name }}
          JEKYLL_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    if: |
      vars.KIT_DEPLOY == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_name == (vars.KIT_BRANCH || 'ett')))
    concurrency:
      group: "pages"
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
