# Sync Core Preservation Processes from WP1
#
# Every Monday this mirrors EOSC-EDEN/wp1-cpp-descriptions into _data/cpps.json and
# pages/cpps/ (var/sync_cpps.py) and opens, or updates, one pull request when anything
# changed. The PR body lists which CPPs changed and how many modules tag each one;
# a CPP that WP1 removed while modules still tag it is flagged and labelled needs-attention.
#
# Branch: the PR targets repository variable KIT_BRANCH (default: ett).
# GitHub only runs scheduled workflows from the DEFAULT branch. While `ett` is not the
# default branch, keep a copy of this file on the default branch too (it checks out
# KIT_BRANCH itself), or run it by hand from the Actions tab.
name: Sync CPPs from WP1

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-cpps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ vars.KIT_BRANCH || 'ett' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror WP1
        id: sync
        run: |
          python3 var/sync_cpps.py --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "still tagged in" "$RUNNER_TEMP/summary.md"; then
            echo "labels=wp1-sync,needs-attention" >> "$GITHUB_OUTPUT"
          else
            echo "labels=wp1-sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Check modules against the new CPP list (report only)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 var/check_modules.py

      - name: Build PR body
        run: |
          {
            echo "Weekly mirror of [WP1 Core Preservation Processes](https://github.com/EOSC-EDEN/wp1-cpp-descriptions)."
            echo "Generated by \`var/sync_cpps.py\`; don't edit these files by hand."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "### Review"
            echo "- [ ] Removed or renamed CPPs: update the modules that tag them"
            echo "- [ ] Changed relationships or mappings look right on a CPP page in the build preview"
          } > "$RUNNER_TEMP/body.md"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A token other than GITHUB_TOKEN lets the site build check run on the PR (optional).
          token: ${{ secrets.KIT_BOT_TOKEN || github.token }}
          base: ${{ vars.KIT_BRANCH || 'ett' }}
          branch: bot/sync-cpps
          delete-branch: true
          add-paths: |
            _data/cpps.json
            pages/cpps/
          commit-message: "Sync CPPs from WP1"
          title: "Sync CPPs from WP1"
          body-path: ${{ runner.temp }}/body.md
          labels: ${{ steps.sync.outputs.labels }}
