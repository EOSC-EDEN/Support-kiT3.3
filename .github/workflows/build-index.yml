name: Build Index
# Deploying moved to pages.yml (old app at /, ETT kit from `ett` at /ett).

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-index.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index.json from articles/
        run: node scripts/build-index.mjs

      - name: Validate index.json
        run: node scripts/validate.mjs

      - name: Commit changes (if on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet index.json; then
            echo "No changes to index.json"
          else
            git add index.json
            git commit -m "chore: regenerate index.json"
            git push
          fi
